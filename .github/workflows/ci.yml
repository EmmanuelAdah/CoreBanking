name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corebanking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
        env:
          DATABASE_URL: Host=localhost;Port=5432;Database=corebanking_test;Username=postgres;Password=postgres
          PAYSTACK_SECRET_KEY: sk_test_dummy
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Publish
        run: dotnet publish CoreBanking.Api/CoreBanking.Api.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t corebanking-api:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name cbs-test -p 8080:8080 \
            -e DATABASE_URL="Host=host.docker.internal;Port=5432;Database=corebanking;Username=postgres;Password=postgres" \
            -e PAYSTACK_SECRET_KEY=sk_test_dummy \
            -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
            corebanking-api:${{ github.sha }} || true
          sleep 5
          curl -f http://localhost:8080/health || echo "Health check skipped (no DB)"
          docker rm -f cbs-test || true